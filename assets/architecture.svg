<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
<title id="title">Self-Regulated Learning Copilot architecture</title>
<desc id="desc">A cyclical self-regulated learning support architecture from goal and plan through strategy use, monitoring, learner-controlled support, reflection, and adaptation.</desc>
<rect width="1200" height="360" rx="24" fill="#f7f8fa"/>
<text x="50" y="48" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#17202a">Self-Regulated Learning Copilot · agency-preserving SRL cycle</text>
<text x="50" y="76" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#59636e">The support policy can intervene, offer choices, or remain completely silent.</text>

<rect x="35" y="125" width="180" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="125" y="154" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Goal + plan</text>
<text x="125" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">next action</text>
<text x="125" y="198" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">success evidence</text>

<line x1="220" y1="177" x2="255" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M247 171 L255 177 L247 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="265" y="125" width="180" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="355" y="154" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Strategy use</text>
<text x="355" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">effort · progress</text>
<text x="355" y="198" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">stall evidence</text>

<line x1="450" y1="177" x2="485" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M477 171 L485 177 L477 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="495" y="105" width="210" height="145" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="600" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Agency gate</text>
<text x="600" y="166" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">productive struggle?</text>
<text x="600" y="186" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">opt-out · cooldown?</text>
<text x="600" y="206" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">learner asked for help?</text>
<text x="600" y="226" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">prompt burden?</text>

<line x1="710" y1="177" x2="745" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M737 171 L745 177 L737 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="755" y="105" width="195" height="145" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="852" y="140" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Support action</text>
<text x="852" y="166" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">silent · plan · monitor</text>
<text x="852" y="186" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">strategy · choice</text>
<text x="852" y="206" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">hint · reflection</text>

<line x1="955" y1="177" x2="990" y2="177" stroke="#8391a1" stroke-width="2"/><path d="M982 171 L990 177 L982 183" fill="none" stroke="#8391a1" stroke-width="2"/>

<rect x="1000" y="125" width="165" height="105" rx="16" fill="#fff" stroke="#38598b" stroke-width="2"/>
<text x="1082" y="154" text-anchor="middle" font-family="Arial" font-size="14" font-weight="700" fill="#26323d">Reflection</text>
<text x="1082" y="178" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">what worked?</text>
<text x="1082" y="198" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">what changes next?</text>

<path d="M1082 238 C1082 315 125 315 125 238" fill="none" stroke="#6d7f8f" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M119 246 L125 238 L131 246" fill="none" stroke="#6d7f8f" stroke-width="2"/>
<text x="600" y="321" text-anchor="middle" font-family="Arial" font-size="13" fill="#59636e">Reflection and learner response can inform the next goal, plan, or strategy cycle.</text>
</svg>