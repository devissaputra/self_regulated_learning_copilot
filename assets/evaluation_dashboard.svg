<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="550" viewBox="0 0 1200 550" role="img" aria-labelledby="title desc">
<title id="title">Self-Regulated Learning Copilot evaluation checklist</title>
<desc id="desc">Evaluation checklist for state validity, trigger validity, support appropriateness, learner agency, prompt burden, and longitudinal independence.</desc>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Self-Regulated Learning Copilot · evaluation checklist</text>
<text x="60" y="99" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">The goal is useful support with minimal unnecessary intervention—not maximum prompting.</text>

<rect x="60" y="140" width="330" height="130" rx="18" fill="#E8F1F3" stroke="#87949A"/>
<text x="82" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">State validity</text>
<text x="82" y="203" font-family="Arial" font-size="14" fill="#26343B">Do supplied or estimated states</text>
<text x="82" y="225" font-family="Arial" font-size="14" fill="#26343B">represent defensible SRL evidence?</text>

<rect x="435" y="140" width="330" height="130" rx="18" fill="#EEF3E8" stroke="#87949A"/>
<text x="457" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Trigger validity</text>
<text x="457" y="203" font-family="Arial" font-size="14" fill="#26343B">Does the policy intervene at useful</text>
<text x="457" y="225" font-family="Arial" font-size="14" fill="#26343B">moments rather than during progress?</text>

<rect x="810" y="140" width="330" height="130" rx="18" fill="#F5EDE4" stroke="#87949A"/>
<text x="832" y="174" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Support appropriateness</text>
<text x="832" y="203" font-family="Arial" font-size="14" fill="#26343B">Is planning, strategy, hint, or</text>
<text x="832" y="225" font-family="Arial" font-size="14" fill="#26343B">reflection support actually useful?</text>

<rect x="60" y="305" width="330" height="130" rx="18" fill="#ECE8F5" stroke="#87949A"/>
<text x="82" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Learner agency</text>
<text x="82" y="368" font-family="Arial" font-size="14" fill="#26343B">Are opt-out, decline, minimal support,</text>
<text x="82" y="390" font-family="Arial" font-size="14" fill="#26343B">and learner-requested help respected?</text>

<rect x="435" y="305" width="330" height="130" rx="18" fill="#F4EFE8" stroke="#87949A"/>
<text x="457" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Prompt burden</text>
<text x="457" y="368" font-family="Arial" font-size="14" fill="#26343B">How often is support shown, declined,</text>
<text x="457" y="390" font-family="Arial" font-size="14" fill="#26343B">repeated, or suppressed by cooldown?</text>

<rect x="810" y="305" width="330" height="130" rx="18" fill="#EAF0EC" stroke="#87949A"/>
<text x="832" y="339" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Longitudinal independence</text>
<text x="832" y="368" font-family="Arial" font-size="14" fill="#26343B">Do learners regulate more effectively</text>
<text x="832" y="390" font-family="Arial" font-size="14" fill="#26343B">without becoming dependent on prompts?</text>

<text x="60" y="488" font-family="Arial" font-size="15" fill="#5B6660">Acceptance is not automatically success; evaluation should include learning, autonomy, burden, and longer-term regulation.</text>
</svg>