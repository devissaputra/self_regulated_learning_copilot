<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">Self-Regulated Learning Copilot data and reasoning flow</title>
<desc id="desc">Explicit SRL state passes through planning and struggle checks, learner-control constraints, support selection, learner response, and longitudinal diagnostics.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#52656D"/></marker></defs>
<rect width="100%" height="100%" fill="#FAFBFA"/>
<text x="60" y="64" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#1B2430">Self-Regulated Learning Copilot · data and reasoning flow</text>
<text x="60" y="98" font-family="Arial, sans-serif" font-size="17" fill="#5B6660">State variables are explicit inputs; the policy does not infer motivation or mental state.</text>

<rect x="45" y="145" width="220" height="145" rx="18" fill="#E8F1F3" stroke="#87949A" stroke-width="2"/>
<text x="155" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Explicit SRL state</text>
<text x="155" y="207" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">goal · progress · strategy</text>
<text x="155" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">effort · stall · monitoring</text>
<text x="155" y="249" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">preference · support history</text>

<line x1="270" y1="217" x2="320" y2="217" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="335" y="145" width="220" height="145" rx="18" fill="#EEF3E8" stroke="#87949A" stroke-width="2"/>
<text x="445" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Policy checks</text>
<text x="445" y="207" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">productive struggle</text>
<text x="445" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">plan completeness</text>
<text x="445" y="249" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">cooldown · opt-out · burden</text>

<line x1="560" y1="217" x2="610" y2="217" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="625" y="125" width="235" height="185" rx="18" fill="#F5EDE4" stroke="#87949A" stroke-width="2"/>
<text x="742" y="160" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Decision + choices</text>
<text x="742" y="188" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">silent monitoring</text>
<text x="742" y="209" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">planning / monitoring</text>
<text x="742" y="230" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">strategy / choice</text>
<text x="742" y="251" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">guided hint / reflection</text>
<text x="742" y="276" text-anchor="middle" font-family="Arial" font-size="12" fill="#5B6660">silent = no learner-facing prompt</text>

<line x1="865" y1="217" x2="915" y2="217" stroke="#52656D" stroke-width="3" marker-end="url(#arrow)"/>

<rect x="930" y="145" width="225" height="145" rx="18" fill="#ECE8F5" stroke="#87949A" stroke-width="2"/>
<text x="1042" y="180" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#1B2430">Response + adaptation</text>
<text x="1042" y="207" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">accept · decline</text>
<text x="1042" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">change strategy</text>
<text x="1042" y="249" text-anchor="middle" font-family="Arial" font-size="13" fill="#26343B">reflection → next cycle</text>

<rect x="45" y="350" width="1110" height="72" rx="16" fill="#FFF7EC" stroke="#D4B27C"/>
<text x="65" y="379" font-family="Arial" font-size="15" font-weight="700" fill="#6F5427">Longitudinal diagnostics</text>
<text x="65" y="403" font-family="Arial" font-size="14" fill="#6F5427">Prompt rate · action counts · productive-struggle interruptions · preference violations · acceptance/decline · strategy-change count.</text>
</svg>