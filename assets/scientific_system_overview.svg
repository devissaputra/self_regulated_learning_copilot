<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><rect width="1600" height="1000" fill="#f8fbff"/><text x="60" y="68" font-size="48" font-family="Arial" font-weight="700" fill="#12345b">Self-Regulated Learning Copilot</text><text x="62" y="108" font-size="23" font-family="Arial" fill="#5b6b82">Scientific System Overview · evidence, model structure, outputs, and validation</text><rect x="55" y="150" width="400" height="690" rx="24" fill="#eef6ff" stroke="#bfd0e2" stroke-width="2"/><text x="79" y="198" font-size="31" font-family="Arial" font-weight="700" fill="#12345b">Evidence & Inputs</text><rect x="500" y="150" width="530" height="690" rx="24" fill="#effaf6" stroke="#bfd0e2" stroke-width="2"/><text x="524" y="198" font-size="31" font-family="Arial" font-weight="700" fill="#12345b">Analytical Core</text><rect x="1080" y="150" width="465" height="690" rx="24" fill="#fff7ef" stroke="#bfd0e2" stroke-width="2"/><text x="1104" y="198" font-size="31" font-family="Arial" font-weight="700" fill="#12345b">Scientific Outputs</text><rect x="80" y="225" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="225" width="11" height="125" rx="5" fill="#2f80d1"/><text x="107" y="258" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Learner goals</text><text x="107" y="292" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Objectives, preferred outcomes, timelines,</text><text x="107" y="314" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">and success criteria</text><rect x="80" y="370" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="370" width="11" height="125" rx="5" fill="#1e9e94"/><text x="107" y="403" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Metacognitive signals</text><text x="107" y="437" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Confidence, planning, monitoring,</text><text x="107" y="459" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">reflection, and self-report</text><rect x="80" y="515" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="515" width="11" height="125" rx="5" fill="#f07a28"/><text x="107" y="548" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Behavior traces</text><text x="107" y="582" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Actions, timing, task sequence, accuracy,</text><text x="107" y="604" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">and persistence</text><rect x="80" y="660" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="660" width="11" height="125" rx="5" fill="#7354b5"/><text x="107" y="693" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Context &amp; constraints</text><text x="107" y="727" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Domain, difficulty, available time,</text><text x="107" y="749" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">resources, and learner control</text><rect x="525" y="225" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="225" width="11" height="105" rx="5" fill="#1e9e94"/><text x="552" y="258" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Learner-state modeling</text><text x="552" y="292" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Infer uncertain cognitive and regulatory</text><text x="552" y="314" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">state from evidence</text><rect x="525" y="343" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="343" width="11" height="105" rx="5" fill="#2f80d1"/><text x="552" y="376" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Self-regulation diagnosis</text><text x="552" y="410" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Identify planning, monitoring, strategy,</text><text x="552" y="432" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">and reflection needs</text><rect x="525" y="461" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="461" width="11" height="105" rx="5" fill="#f07a28"/><text x="552" y="494" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Adaptive prompting</text><text x="552" y="528" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Select timely prompts without removing</text><text x="552" y="550" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">learner agency</text><rect x="525" y="579" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="579" width="11" height="105" rx="5" fill="#7354b5"/><text x="552" y="612" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Reflection support</text><text x="552" y="646" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Scaffold explanation, self-assessment, and</text><text x="552" y="668" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">strategy revision</text><rect x="525" y="697" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="697" width="11" height="105" rx="5" fill="#3f9458"/><text x="552" y="730" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Recommendation logic</text><text x="552" y="764" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Balance likely benefit, feasibility,</text><text x="552" y="786" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">diversity, and learner choice</text><rect x="1105" y="225" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="225" width="11" height="115" rx="5" fill="#2f80d1"/><text x="1132" y="258" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Regulation profile</text><text x="1132" y="292" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Evidence-linked strengths and areas for</text><text x="1132" y="314" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">self-regulation</text><rect x="1105" y="358" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="358" width="11" height="115" rx="5" fill="#f07a28"/><text x="1132" y="391" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Next-step guidance</text><text x="1132" y="425" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Optional actions aligned with goals and</text><text x="1132" y="447" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">current state</text><rect x="1105" y="491" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="491" width="11" height="115" rx="5" fill="#3f9458"/><text x="1132" y="524" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Reflection prompts</text><text x="1132" y="558" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Questions supporting monitoring and</text><text x="1132" y="580" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">metacognition</text><rect x="1105" y="624" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="624" width="11" height="115" rx="5" fill="#7354b5"/><text x="1132" y="657" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Progress monitoring</text><text x="1132" y="691" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Learning and strategy trajectories with</text><text x="1132" y="713" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">uncertainty</text><line x1="430" y1="485" x2="500" y2="485" stroke="#1e9e94" stroke-width="7"/><polygon points="500,485 478,470 478,500" fill="#1e9e94"/><line x1="1030" y1="485" x2="1080" y2="485" stroke="#f07a28" stroke-width="7"/><polygon points="1080,485 1058,470 1058,500" fill="#f07a28"/><rect x="55" y="865" width="1490" height="95" rx="20" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><text x="80" y="900" font-size="24" font-family="Arial" font-weight="700" fill="#12345b">Research checks</text><circle cx="300" cy="895" r="12" fill="#2f80d1"/><text x="320" y="902" font-size="17" font-family="Arial" fill="#5b6b82">reproducibility</text><circle cx="490" cy="895" r="12" fill="#1e9e94"/><text x="510" y="902" font-size="17" font-family="Arial" fill="#5b6b82">uncertainty</text><circle cx="680" cy="895" r="12" fill="#f07a28"/><text x="700" y="902" font-size="17" font-family="Arial" fill="#5b6b82">calibration</text><circle cx="870" cy="895" r="12" fill="#7354b5"/><text x="890" y="902" font-size="17" font-family="Arial" fill="#5b6b82">fairness</text><circle cx="1060" cy="895" r="12" fill="#3f9458"/><text x="1080" y="902" font-size="17" font-family="Arial" fill="#5b6b82">ablation</text><circle cx="1250" cy="895" r="12" fill="#cc4a4a"/><text x="1270" y="902" font-size="17" font-family="Arial" fill="#5b6b82">external validity</text><text x="1000" y="940" font-size="23" font-family="Georgia" font-style="italic" fill="#12345b">z_{t+1}=αz_t+(1−α)f(x_t,a_t,c_t)+ε_t</text><text x="80" y="944" font-size="14" font-family="Arial" fill="#5b6b82">Conceptual schematic only · empirical values are reported separately in repository outputs.</text></svg>