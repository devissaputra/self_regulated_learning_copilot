<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="365" viewBox="0 0 1200 365" role="img" aria-labelledby="title desc">
<title id="title">Self-Regulated Learning Copilot synthetic demo</title>
<desc id="desc">Eight synthetic longitudinal learner trajectories cover planning, productive struggle, learner-requested help, opt-out, prompt burden, monitoring, strategy change, and reflection.</desc>
<rect width="1200" height="365" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic SRL trajectory demo</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">Eight synthetic trajectories · explicit learner control · no real learner data.</text>

<rect x="52" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Planning</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">missing plan → prompt</text>
<text x="70" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">then progress + reflection</text>

<rect x="320" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="338" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Agency</text>
<text x="338" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">productive struggle → silent</text>
<text x="338" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">opt-out remains respected</text>

<rect x="588" y="112" width="250" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="606" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Adaptation</text>
<text x="606" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">strategy change recorded</text>
<text x="606" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">reflection informs next cycle</text>

<rect x="856" y="112" width="292" height="120" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="874" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Burden control</text>
<text x="874" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">cooldown + support limit</text>
<text x="874" y="198" font-family="Arial" font-size="13" fill="#cbd5e1">help requests can override passivity</text>

<text x="52" y="278" font-family="Arial" font-size="14" fill="#d1d5db">The demo prints every action, reason, prompt, learner response, strategy update, and per-trajectory policy diagnostic.</text>
<text x="52" y="307" font-family="Arial" font-size="14" fill="#d1d5db">All thresholds, states, responses, and outcomes are synthetic test fixtures rather than empirical findings.</text>
<text x="52" y="337" font-family="Arial" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
</svg>