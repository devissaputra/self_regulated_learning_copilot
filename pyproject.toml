[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "self-regulated-learning-copilot"
version = "0.1.0"
description = "Agency-preserving self-regulated learning support policy with planning, monitoring, strategy adaptation, reflection, and prompt-burden controls."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "self-regulated-learning",
  "learning-analytics",
  "adaptive-scaffolding",
  "learner-agency",
  "metacognition",
  "learning-strategies",
  "ai-in-education",
  "python",
]

[project.urls]
Repository = "https://github.com/devissaputra/self_regulated_learning_copilot"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
